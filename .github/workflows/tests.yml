name: Tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make install test PYTHON=python
