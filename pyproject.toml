[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sweetify"
dynamic = ["version"]
description = "SweetAlert integration for Django"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{name = "Atrox", email = "hello@atrox.dev"}]
requires-python = ">=3.14"
dependencies = ["Django>=6.0"]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Repository = "https://github.com/justutor-v2/sweetify-django"

[tool.setuptools.dynamic]
version = {attr = "sweetify.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["sweetify*"]

[tool.setuptools.package-data]
sweetify = ["static/sweetify/sweetalert2/*", "templates/sweetify/*.html"]
